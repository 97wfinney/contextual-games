[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextual-games"
version = "0.1.0"
description = "Computational tools for contextual fraction, non-local games, and quantum advantage."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "William Finney" }
]
dependencies = [
  "numpy",
  "scipy",
  "cvxpy",
  "pandas",
  "matplotlib",
  "ncpol2sdpa"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "jupyter"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
